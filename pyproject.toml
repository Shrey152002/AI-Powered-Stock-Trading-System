[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "RL-based AAPL trading agent with training, backtesting, and paper trading"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
